name: Release extension ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify
        run: npm run verify
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/lee-relay-v*.zip \
            dist/lee-relay-v*.zip.sha256 \
            --title "Lee Relay $GITHUB_REF_NAME" \
            --generate-notes
